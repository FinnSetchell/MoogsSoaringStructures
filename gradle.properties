# Build inputs only. Everything the publish pipeline needs (project ids, MC windows,
# display names, Discord styling, dependencies) lives in .github/moogs-publish.yml on the
# repository's default branch. Keys are snake_case fleet-wide.
org.gradle.jvmargs=-Xmx2G

# Project
mod_id=mss
mod_name=MoogsSoaringStructures
mod_version=2.1.2
mod_description=Moogs Soaring Structures brings life, fun and variety to your Minecraft world! Explore awesome new structures made with vanilla blocks and entities, and discover loot, enemies, and villagers along the way. This mod is compatible with any modpack and keeps the vanilla feel of the game!

# Minecraft
minecraft_version=1.20

# Metadata links expanded into fabric.mod.json / quilt.mod.json / mods.toml / pack.mcmeta
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/mss-moogs-soaring-structures
mod_sources=https://github.com/FinnSetchell/MoogsSoaringStructures
mod_releases=https://github.com/FinnSetchell/MoogsSoaringStructures/releases
mod_issues=https://github.com/FinnSetchell/MoogsSoaringStructures/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://www.curseforge.com/minecraft/mc-mods/mss-moogs-soaring-structures
mod_modrinth=https://modrinth.com/mod/mss-moogs-soaring-structures

# Structure Lib dependency range (forge/neoforge mods.toml)
structure_lib_version_range=[1.0.0,)
